[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-copilot-agent"
version = "1.0.0"
description = "Autonomous Multi-Tool LangChain Agent for Meeting Ingestion, Syllabus Alignment Auditing & Educational Material Synthesis"
authors = [{ name = "Rodrigo Paz", email = "contactorodrigopaz@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.3.0",
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.0",
    "langchain-google-genai>=4.4.0",
    "pydantic>=2.9.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
